name: CI
on: [pull_request]
jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: git fetch origin main
      - uses: ./.github/actions/setup-env
      - run: bun run lint
      - run: bun run format:verify
      - run: bun run build
      - run: bun run check:package
      - run: bunx changeset status --since=origin/main
